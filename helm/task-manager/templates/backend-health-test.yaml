apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-backend-health-test
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "task-manager.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health-check
      image: curlimages/curl:latest
      command: ["sh", "-c", "curl -sSf http://{{ .Release.Name }}-backend-service:{{ .Values.backend.service.port }}{{ .Values.backend.probes.livenessProbe.path }}"]